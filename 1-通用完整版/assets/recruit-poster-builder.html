<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI赛事英雄帖生成器 · 填表生成器</title>
<style>
  :root{
    --bg:#0a0e17; --gold:#d4a843; --gold-light:#f5d77a; --ink:#eef3fb; --ink-dim:#b8c6db;
    --line:rgba(255,255,255,.10); --panel:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, rgba(212,168,67,.08), transparent 55%), #05080e;
    color:var(--ink); line-height:1.6; min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;background:rgba(8,12,20,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:18px;font-weight:800;letter-spacing:.04em;
    background:linear-gradient(95deg,var(--gold-light),var(--gold) 60%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header .hint{font-size:12.5px;color:var(--ink-dim);}
  header .spacer{flex:1;}
  header input[type=text]{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink);
    padding:8px 12px;font-size:13px;min-width:200px;
  }
  .btn{
    background:linear-gradient(120deg,var(--gold),var(--gold-light));color:#1a1206;border:none;
    border-radius:10px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,168,67,.35);}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}

  .layout{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:0;align-items:start;}
  @media(max-width:920px){.layout{grid-template-columns:1fr;}}

  /* 左侧表单 */
  .form{
    padding:20px 22px 60px;max-height:calc(100vh - 62px);overflow-y:auto;
    border-right:1px solid var(--line);
  }
  @media(max-width:920px){.form{max-height:none;border-right:none;border-bottom:1px solid var(--line);}}
  fieldset{border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;margin-bottom:16px;background:var(--panel);}
  legend{font-size:13px;font-weight:700;color:var(--gold);padding:0 8px;letter-spacing:.03em;}
  .fld{margin-bottom:11px;}
  .fld:last-child{margin-bottom:0;}
  .fld label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px;}
  .fld input[type=text], .fld textarea{
    width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);padding:8px 11px;font-size:13.5px;font-family:inherit;resize:vertical;
  }
  .fld textarea{min-height:54px;line-height:1.5;}
  .fld textarea.tall{min-height:90px;}
  .fld .sub{font-size:11px;color:#64748b;margin-top:3px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* 右侧预览 */
  .preview{padding:22px;position:sticky;top:62px;}
  .preview .ph{font-size:12px;color:var(--ink-dim);margin-bottom:12px;text-align:center;letter-spacing:.04em;}
  .preview iframe{
    width:100%;height:78vh;border:1px solid var(--line);border-radius:18px;background:#0a0e17;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#11203a;border:1px solid var(--gold);color:var(--gold-light);padding:11px 20px;border-radius:12px;
    font-size:13.5px;transition:.25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <h1>AI赛事英雄帖生成器 · 填表生成器</h1>
  <span class="hint">填左表 → 右实时预览 → 导出 HTML（视觉继承定稿版）</span>
  <span class="spacer"></span>
  <input type="text" id="fileName" value="招募帖-生成" placeholder="导出文件名（不含后缀）">
  <button class="btn ghost" id="resetBtn">载入示例</button>
  <button class="btn" id="exportBtn">导出 HTML</button>
</header>

<div class="layout">
  <!-- 表单 -->
  <form class="form" id="form" autocomplete="off">
    <fieldset>
      <legend>① 头部标题</legend>
      <div class="fld"><label>一句话定位 / 技术栈</label><input type="text" id="kicker" placeholder="如：全模态大模型 · 端侧 NPU"></div>
      <div class="fld"><label>品牌 / 赛事简称（金色大标）</label><input type="text" id="brand" placeholder="如：BRAND"></div>
      <div class="fld"><label>赛事 / 活动全称</label><input type="text" id="eventName" placeholder="如：XX 推理优化与应用创新挑战赛"></div>
      <div class="fld"><label>招募主标题（毛笔大字）</label><input type="text" id="heroTitle" placeholder="如：英雄招募帖"></div>
    </fieldset>

    <fieldset>
      <legend>② 赛事简介</legend>
      <div class="fld"><label>赛事名称（正文首行加粗）</label><input type="text" id="introLead" placeholder="如：XX & XX 推理优化与应用创新挑战赛"></div>
      <div class="fld"><label>介绍正文</label><textarea class="tall" id="introBody" placeholder="背景、定位、要求、鼓励方向等……"></textarea></div>
      <div class="fld"><label>方向标签（每行一个）</label><textarea id="chips" placeholder="实时问答&#10;伴随式助手&#10;视觉 / 语音交互"></textarea></div>
      <div class="fld"><label>要求项（每行：标签：内容）</label><textarea id="reqs" placeholder="复现要求：统一运行环境&#10;提交四件套：Demo · PPT · 说明 · 视频&#10;队伍上限：3 人&#10;报名截止：XX.XX"></textarea></div>
      <div class="row2">
        <div class="fld"><label>队伍上限</label><input type="text" id="teamLimit" placeholder="3 人"></div>
        <div class="fld"><label>报名截止</label><input type="text" id="deadline" placeholder="XX.XX"></div>
      </div>
      <div class="fld"><label>官方网站完整 URL</label><input type="text" id="officialUrl" placeholder="https://..."></div>
    </fieldset>

    <fieldset>
      <legend>③ 比赛奖励</legend>
      <div class="row2">
        <div class="fld"><label>冠军</label><input type="text" id="r1" placeholder="冠军 Xw"></div>
        <div class="fld"><label>亚军</label><input type="text" id="r2" placeholder="亚军 2.5w / 人"></div>
      </div>
      <div class="fld"><label>季军</label><input type="text" id="r3" placeholder="季军 1w / 人"></div>
    </fieldset>

    <fieldset>
      <legend>④ 负责人 / 项目进展</legend>
      <div class="fld"><label>章节标题</label><input type="text" id="projSecTitle" placeholder="如：队长的项目进度及比赛目标"></div>
      <div class="row2">
        <div class="fld"><label>负责人称谓</label><input type="text" id="projRole" placeholder="如：队长"></div>
        <div class="fld"><label>一句话定位</label><input type="text" id="projLead" placeholder="基于自研技术，正带队参赛。"></div>
      </div>
      <div class="fld"><label>进展条目（每行：标签：内容）</label><textarea id="projItems" placeholder="项目定位：面向 XX 场景的软硬件产品&#10;市场判断：需求刚性、前景巨大&#10;当前进度：已完成第一阶段测试&#10;比赛目标：模块化升级 1.0 版本"></textarea></div>
    </fieldset>

    <fieldset>
      <legend>⑤ 招募队友要求</legend>
      <div class="fld"><label>团队上限</label><input type="text" id="teamLimit2" placeholder="3 人（与②一致可省略）"></div>
      <div class="fld"><label>席位卡片（每行：标题 | 职责 | 技能）</label><textarea class="tall" id="seats" placeholder="① 电子系统 · 模块化组装 | 精通电子系统，独立完成模块化设计与组装 | 电子系统 / 模块化 / 组装调试&#10;② 宣传制作 | 独立文案撰写与演示视频剪辑 | 文案 / 视频编辑 / 宣传表达"></textarea></div>
      <div class="fld"><label>通用要求（每行一句，可空）</label><textarea id="generalReq" placeholder="认同评审标准、能稳定投入、习惯协作；有实战经验者优先。"></textarea></div>
    </fieldset>

    <fieldset>
      <legend>⑥ 联系方式</legend>
      <div class="fld"><label>联系口号</label><input type="text" id="ctaLead" placeholder="如：带作品私聊"></div>
      <div class="fld"><label>联系说明</label><input type="text" id="ctaNote" placeholder="如：有意者请附带得意作品，加微信私聊。"></div>
      <div class="row2">
        <div class="fld"><label>联系人</label><input type="text" id="contactName" placeholder="如：XXX"></div>
        <div class="fld"><label>微信号</label><input type="text" id="contactWx" placeholder="如：XXX"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>⑦ 页脚</legend>
      <div class="row2">
        <div class="fld"><label>品牌简称</label><input type="text" id="footerBrand" placeholder="如：BRAND"></div>
        <div class="fld"><label>生态简称</label><input type="text" id="footerEco" placeholder="如：ECO"></div>
      </div>
    </fieldset>
  </form>

  <!-- 预览 -->
  <div class="preview">
    <div class="ph">实时预览（2:3 竖版 · 与定稿主帖同视觉）</div>
    <iframe id="pv" title="预览"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============== 定稿主帖的完整 CSS（视觉继承，勿改） ============== */
const POSTER_CSS = `
  @font-face{font-family:"LiuJianMaoCao";src:url("design-assets/fonts/LiuJianMaoCao-poster.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}

  :root{
    --bg:#0a0e17;--gold:#d4a843;--gold-light:#f5d77a;--gold-dark:#9a6f1c;

  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background-color:#05080e;color:var(--ink);line-height:1.85;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;-webkit-font-smoothing:antialiased;}
  .poster{position:relative;width:min(92vw,720px);aspect-ratio:2 / 3;max-height:94vh;border-radius:24px;overflow:hidden;background-color:#0a0e17;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);z-index:0;}
  .hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:url("design-assets/hero-silhouette.png") 75% bottom / contain no-repeat;transform-origin:75% 100%;transform:translate(81%, 24%) rotate(0deg) scale(2.66);filter:invert(100%) brightness(48%) contrast(115%) saturate(100%) sepia(0%) grayscale(0%) hue-rotate(0deg) blur(0px);}
  .poster::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 120% 70% at 50% -10%, rgba(212,168,67,.10), transparent 55%),linear-gradient(180deg, rgba(4,6,10,.99) 0%, rgba(4,6,10,.93) 30%, rgba(4,6,10,.72) 50%, rgba(4,6,10,.44) 64%, rgba(4,6,10,.62) 100%);}
  .aurora{position:absolute;left:50%;top:-260px;width:118%;height:auto;aspect-ratio:2/1;z-index:0;pointer-events:none;background:radial-gradient(ellipse 46% 50% at 50% 48%, rgba(212,168,67,.10), transparent 70%);filter:blur(14px);transform:translateX(-50%);animation:aurora-breathe 9s ease-in-out infinite;}
  .aurora-2{position:absolute;right:-12%;top:20%;width:70%;aspect-ratio:1/1;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%, rgba(212,168,67,.06), transparent 65%);filter:blur(18px);animation:aurora-breathe-2 11s ease-in-out infinite;}
  @keyframes aurora-breathe{0%,100%{opacity:.7;transform:translateX(-50%) translateY(0);}50%{opacity:1;transform:translateX(-50%) translateY(18px);}}
  @keyframes aurora-breathe-2{0%,100%{opacity:.55;transform:translateY(0) scale(1);}50%{opacity:.85;transform:translateY(-14px) scale(1.04);}}
  .vignette{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 118% 92% at 50% 32%, transparent 58%, rgba(3,5,9,.5) 100%);}
  .spark{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 8px at 22% 24%, rgba(245,215,122,.12), transparent 70%),radial-gradient(circle 5px at 70% 18%, rgba(255,255,255,.10), transparent 70%),radial-gradient(circle 7px at 84% 60%, rgba(245,215,122,.08), transparent 70%),radial-gradient(circle 9px at 33% 82%, rgba(255,255,255,.09), transparent 70%),radial-gradient(circle 4px at 56% 44%, rgba(255,255,255,.10), transparent 70%),radial-gradient(circle 5px at 46% 66%, rgba(245,215,122,.07), transparent 70%);filter:blur(4px);animation:spark-tw 8s ease-in-out infinite;}
  @keyframes spark-tw{0%,100%{opacity:.18;}50%{opacity:.36;}}

  .wrap{position:absolute;inset:0;z-index:2;overflow-y:auto;padding:46px 30px 54px;-webkit-overflow-scrolling:touch;}
  .head{text-align:center;padding:14px 0 34px;}
  .kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-bottom:26px;opacity:.75;}
  .title-mini{font-family:var(--mono);font-weight:800;line-height:1;letter-spacing:.08em;font-size:clamp(34px,7vw,56px);background:linear-gradient(95deg,var(--gold-light) 0%,var(--gold) 45%,var(--gold-dark) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;}
  .title-event{font-size:clamp(18px,4.2vw,30px);font-weight:700;line-height:1.3;letter-spacing:.05em;color:var(--ink);margin-bottom:20px;}
  .title-hero{display:flex;justify-content:center;margin:6px 0 18px;font-family:var(--brush);font-weight:400;font-size:clamp(58px,12vw,98px);letter-spacing:.06em;line-height:1.1;color:transparent;padding:2px 16px 14px;background:linear-gradient(165deg,#fff6d8 0%,var(--gold-light) 38%,var(--gold) 72%,#f0cf7e 100%);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 30px rgba(245,215,122,.55),0 0 75px rgba(212,168,67,.32);}
  .head-rule{width:120px;height:3px;margin:26px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* ============== 工具函数 ============== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lines(s){return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);}

/* 把 "标签：内容" 解析成 <span>标签：<b>内容</b></span> */
function labeled(spans){
  return lines(spans).map(function(s){
    var i=s.indexOf('：');
    if(i<0) return '<span>'+esc(s)+'</span>';
    return '<span>'+esc(s.slice(0,i))+'：<b>'+esc(s.slice(i+1))+'</b></span>';
  }).join('');
}

/* ============== 读取表单 ============== */
function readData(){
  var g=function(id){return document.getElementById(id).value;};
  return {
    kicker:g('kicker'), brand:g('brand'), eventName:g('eventName'), heroTitle:g('heroTitle'),
    introLead:g('introLead'), introBody:g('introBody'),
    chips:lines(g('chips')).map(function(s){return '<span class="chip mini">'+esc(s)+'</span>';}).join(''),
    reqs:labeled(g('reqs')),
    teamLimit:g('teamLimit')||g('teamLimit2'), deadline:g('deadline'),
    officialUrl:g('officialUrl'),
    r1:g('r1'), r2:g('r2'), r3:g('r3'),
    projSecTitle:g('projSecTitle'), projRole:g('projRole'), projLead:g('projLead'),
    projItems:labeled(g('projItems')),
    teamLimit2:g('teamLimit2'),
    seats:lines(g('seats')).map(function(s){
      var p=s.split('|').map(function(x){return x.trim();});
      return '<div class="card"><h3>'+esc(p[0]||'')+'</h3><p>'+esc(p[1]||'')+'</p><span class="tag">硬技能：'+esc(p[2]||'')+'</span></div>';
    }).join(''),
    generalReq:lines(g('generalReq')).map(function(s){return esc(s);}).join('<br>'),
    ctaLead:g('ctaLead'), ctaNote:g('ctaNote'),
    contactName:g('contactName'), contactWx:g('contactWx'),
    footerBrand:g('footerBrand'), footerEco:g('footerEco')
  };
}

/* ============== 生成海报 HTML（body 内部） ============== */
function buildPoster(d){
  var rewards=[];
  if(d.r1) rewards.push('<div class="pill"><div class="k">RANK-1</div><div class="v">'+esc(d.r1)+'</div></div>');
  if(d.r2) rewards.push('<div class="pill"><div class="k">RANK-2</div><div class="v">'+esc(d.r2)+'</div></div>');
  if(d.r3) rewards.push('<div class="pill"><div class="k">RANK-3</div><div class="v">'+esc(d.r3)+'</div></div>');
  var rewardHtml = rewards.length ? '<div class="split">'+rewards.join('')+'</div>' : '';

  var official = '';
  if(d.officialUrl){
    official='<a class="official-link" href="'+esc(d.officialUrl)+'" target="_blank" rel="noopener">'+
      '<span class="ol-label">赛事官方网站</span>'+
      '<span class="ol-url">'+esc(d.officialUrl)+'</span>'+
      '<span class="ol-enter">一键进入 <span class="arrow">↗</span></span></a>';
  }

  var teamLimitHtml = d.teamLimit ? '队伍上限 <strong>'+esc(d.teamLimit)+'</strong>' : '';
  var generalReqHtml = d.generalReq ? '<p style="margin-top:13px;font-size:14.5px;color:var(--ink-dim);line-height:1.8;">'+d.generalReq+'</p>' : '';

  return ''+
  '<div class="poster">'+
    '<div class="hero-bg"></div><div class="aurora"></div><div class="aurora-2"></div>'+
    '<div class="vignette"></div><div class="spark"></div>'+
    '<div class="wrap">'+
      '<div class="head">'+
        '<div class="kicker">'+esc(d.kicker)+'</div>'+
        '<h1 class="title-mini">'+esc(d.brand)+'</h1>'+
        '<div class="title-event">'+esc(d.eventName)+'</div>'+
        '<div class="title-hero">'+esc(d.heroTitle)+'</div>'+
        '<div class="head-rule"></div>'+
      '</div>'+
      '<section class="sec">'+
        '<div class="sec-head"><span class="sec-no">01</span><span class="sec-title">赛事简介</span></div>'+
        '<div class="sec-body">'+
          '<p class="lead">'+esc(d.introLead)+'</p>'+
          '<div style="margin-top:8px;">'+esc(d.introBody).replace(/\n/g,'<br>')+'</div>'+
          '<div class="chips">'+d.chips+'</div>'+
          '<div class="meta">'+d.reqs+'</div>'+
          official+
        '</div>'+
      '</section>'+
      '<section class="sec">'+
        '<div class="sec-head"><span class="sec-no">02</span><span class="sec-title">比赛奖励</span></div>'+
        '<div class="sec-body">'+rewardHtml+'</div>'+
      '</section>'+
      '<section class="sec">'+
        '<div class="sec-head"><span class="sec-no">03</span><span class="sec-title">'+esc(d.projSecTitle)+'</span></div>'+
        '<div class="sec-body">'+
          '<strong>'+esc(d.projRole)+'</strong>'+esc(d.projLead)+
          '<div class="meta" style="flex-direction:column;gap:7px;">'+d.projItems+'</div>'+
        '</div>'+
      '</section>'+
      '<section class="sec">'+
        '<div class="sec-head"><span class="sec-no">04</span><span class="sec-title">招募队友要求</span></div>'+
        '<div class="sec-body">'+
          (teamLimitHtml? teamLimitHtml+'，':'')+'现开放 '+ (d.seats? (d.seats.match(/class="card"/g)||[]).length : 0) +' 个席位：'+
          '<div class="cards">'+d.seats+'</div>'+
          generalReqHtml+
        '</div>'+
      '</section>'+
      '<section class="sec">'+
        '<div class="sec-head"><span class="sec-no">05</span><span class="sec-title">联系方式</span></div>'+
        '<div class="sec-body">'+
          '<div class="cta">'+
            '<div class="lead">'+esc(d.ctaLead)+'</div>'+
            '<div class="note">'+esc(d.ctaNote)+'</div>'+
            '<div class="contact">'+esc(d.contactName)+' &nbsp;·&nbsp; 微信号：'+esc(d.contactWx)+'</div>'+
          '</div>'+
        '</div>'+
      '</section>'+
      '<footer>'+esc(d.footerBrand)+' &amp; '+esc(d.footerEco)+' · '+esc(d.heroTitle)+'</footer>'+
    '</div>'+
  '</div>';
}

/* ============== 预览 ============== */
function renderPreview(){
  var d=readData();
  var html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">'+
    '<base href="'+location.href+'">'+
    '<style>'+POSTER_CSS+'</style></head><body>'+
    buildPoster(d)+
    '</body></html>';
  document.getElementById('pv').srcdoc=html;
}

/* ============== 导出完整 HTML ============== */
function exportHTML(){
  var d=readData();
  var title=(d.eventName||'AI赛事英雄帖')+' · '+(d.heroTitle||'');
  var full='<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'+
    '<title>'+esc(title)+'</title>\n<style>'+POSTER_CSS+'\n</style>\n</head>\n<body>\n'+
    buildPoster(d)+
    '\n</body>\n</html>\n';
  var name=(document.getElementById('fileName').value||'招募帖-生成').trim();
  var blob=new Blob([full],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  showToast('已导出：'+name+'.html（与本文件同目录放入 design-assets 即可正常显示）');
}

/* ============== 提示条 ============== */
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},3200);
}
